    CustomerRequestStatus:
      type: string
      enum: [new, reviewing, planned, shipped, declined]

    CustomerRequest:
      type: object
      description: Something a customer asked for. Guests don't see these.
      required: [id, requesterEmail, title, body, status, public, response, voteCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        requesterEmail:
          type: string
        title:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/CustomerRequestStatus"
        public:
          type: boolean
          description: Listed on the portal's public board, if the workspace has one.
        response:
          type: string
          description: The team's answer, shown to the requester.
        issueId:
          type: string
          format: uuid
          description: The issue that would deliver it. Completing the issue ships the request.
        voteCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequestRequest:
      type: object
      required: [id, title, requesterEmail]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        requesterEmail:
          type: string
        issueId:
          type: string
          format: uuid

    UpdateCustomerRequestRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/CustomerRequestStatus"
        public:
          type: boolean
        response:
          type: string
        issueId:
          type: string
          format: uuid
          nullable: true

    PortalRequest:
      type: object
      description: A request as a portal visitor sees it.
      required: [id, title, body, status, response, voteCount, voted, mine, public, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/CustomerRequestStatus"
        response:
          type: string
        voteCount:
          type: integer
          format: int32
        voted:
          type: boolean
        mine:
          type: boolean
        public:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Portal:
      type: object
      required: [name, urlKey, intro, publicBoard, requests]
      properties:
        name:
          type: string
        urlKey:
          type: string
        intro:
          type: string
        publicBoard:
          type: boolean
        email:
          type: string
          description: Who the visitor is signed in as, if they are.
        requests:
          type: array
          description: The visitor's own requests, and the public board if there is one.
          items:
            $ref: "#/components/schemas/PortalRequest"

    CreatePortalRequestRequest:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string

    ImportSource:
      type: string
      description: Where an import comes from.
      enum: [github, linear, jira, csv, bundle]

    ImportProvider:
      type: string
      enum: [github, linear, jira]

    ImportConnection:
      type: object
      required: [provider, label, connectedAt]
      properties:
        provider:
          $ref: "#/components/schemas/ImportProvider"
        label:
          type: string
          description: The account or site, in words.
        connectedAt:
          type: string
          format: date-time

    ImportConnections:
      type: object
      required: [available, connections, resumable]
      properties:
        available:
          type: array
          description: The trackers this server is set up to connect to.
          items:
            $ref: "#/components/schemas/ImportProvider"
        connections:
          type: array
          description: The caller's own connections in this workspace.
          items:
            $ref: "#/components/schemas/ImportConnection"
        resumable:
          type: boolean
          description: |
            Whether an import's credentials are kept, encrypted, while it
            runs, so that it carries on by itself after a server restart.

    ImportRequest:
      type: object
      description: |
        What to import and how. Without a connection, credentials come with
        the request; they are kept (encrypted, and only on a server set up
        for it) no longer than the import runs. The rest is kept with the
        import so that it can be run again.
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/ImportSource"
        github:
          type: object
          required: [repo]
          properties:
            repo:
              type: string
              description: "owner/name"
            token:
              type: string
              description: A personal access token. Needed for private repositories unless useConnection is set; without either GitHub allows only 60 requests an hour.
            baseUrl:
              type: string
              description: The API address of a GitHub Enterprise Server, e.g. https://github.example.com/api/v3.
        linear:
          type: object
          properties:
            apiKey:
              type: string
              description: Needed unless useConnection is set.
        jira:
          type: object
          description: baseUrl and token are needed unless useConnection is set.
          properties:
            baseUrl:
              type: string
              description: https://your-site.atlassian.net, or the address of a Jira Server or Data Center.
            email:
              type: string
              description: The account's email, for Jira Cloud. Leave out to send the token as a bearer token (Server and Data Center).
            token:
              type: string
        csv:
          type: object
          description: |
            A CSV export, such as Linear's, Jira's or a spreadsheet's. It
            needs a column of titles; issue keys (ENG-12), dates, statuses,
            people, labels, parents and projects are used when present.
          required: [text]
          properties:
            text:
              type: string
              description: The file's contents.
            name:
              type: string
              description: Which export this is, e.g. its file name. Importing a newer copy under the same name updates the first.
            teamName:
              type: string
              description: The team for rows that don't say which team they are in.
        bundle:
          type: object
          description: A file in the import format (docs/import-format.md), for source "bundle".
          additionalProperties: true
        teams:
          type: array
          description: IDs (from the preview) of the source teams to import. Empty means all of them.
          items:
            type: string
        asProjects:
          type: boolean
          description: |
            Brings each source team in as a project of the team teamMap sends
            it to, rather than as a team of its own. Every team imported then
            needs an entry in teamMap.
        teamMap:
          type: object
          description: Sends a source team (by its ID) into an existing team instead of a new one.
          additionalProperties:
            type: string
            format: uuid
        userMap:
          type: object
          description: Says who a source user (by their ID) is here. An empty string means nobody. Users left out are matched by email.
          additionalProperties:
            type: string
        useConnection:
          type: boolean
          description: Reads the source through the caller's connection to it (GitHub, Linear or Jira Cloud) instead of a token in the request.
        full:
          type: boolean
          description: |
            Reads everything again. Otherwise, when the same thing was
            imported to the end before, a GitHub or Jira import reads only
            what changed since then.

    ImportPreview:
      type: object
      description: What a source has to offer, before anything is imported.
      required: [label, teams, users]
      properties:
        label:
          type: string
        teams:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewTeam"
        users:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewUser"

    ImportPreviewTeam:
      type: object
      required: [id, key, name, issues]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        issues:
          type: integer
          format: int32
          description: How many issues it has, or -1 if the source doesn't say.
        teamId:
          type: string
          format: uuid
          description: The existing team its issues would go into, if one matches.

    ImportPreviewUser:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        userId:
          type: string
          format: uuid
          description: |
            The member they were matched to, if any: by email, by GitHub
            username, as the person whose credentials these are, or by a
            name only one member has.

    ImportStatus:
      type: string
      enum: [running, done, failed, undone]

    Import:
      type: object
      description: One run of an importer.
      required: [id, source, label, status, stage, counts, warnings, error, createdAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        label:
          type: string
        status:
          $ref: "#/components/schemas/ImportStatus"
        stage:
          type: string
          description: What it is doing right now.
        counts:
          type: object
          description: How many of each thing it created or updated.
          additionalProperties:
            type: integer
        warnings:
          type: array
          items:
            type: string
        error:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        request:
          type: object
          description: |
            The ImportRequest that started it, with credentials blanked and
            file contents left out. Sent again with the credentials filled
            in, it runs the same import. Absent for imports from a file and
            for those started before this was kept.
          additionalProperties: true

    SyncModel:
      type: string
      enum: [User, Team, TeamMember, WorkflowState, Label, Issue, Comment, Reaction, Activity, Attachment, Notification, Project, Milestone, Cycle, Relation, Template, View, Favorite, PullRequest, TimeEntry, Initiative, ProjectDependency, ProjectUpdate, CustomerRequest]

    SyncAction:
      description: One change to a synced record.
      type: object
      required: [syncId, model, modelId, action, data]
      properties:
        syncId:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/SyncModel"
        modelId:
          type: string
          format: uuid
        action:
          type: string
          enum: [I, U, D]
          description: Insert, update or delete.
        data:
          type: object
          description: The record after the change (before it, for deletes), in the model's schema.

    SyncMessage:
      description: A WebSocket frame sent by the server on the sync socket.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [actions, reset]
          description: |
            `actions` carries changes to apply in order. `reset` means the
            client's copy can no longer be patched (its access changed or it
            fell too far behind) and it must bootstrap again.
        lastSyncId:
          type: integer
          format: int64
          description: With `actions`, the sync ID the client is current as of afterwards.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/SyncAction"
