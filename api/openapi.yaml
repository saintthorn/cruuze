      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        more:
          type: boolean
          description: Whether there are older ones to fetch.

    Calibration:
      description: |
        How the forecasting method did against this history: of the past
        four-week forecasts that could be checked ("85% likely to complete at
        least N"), how many held. About 85% should.
      type: object
      required: [windows, held]
      properties:
        windows:
          type: integer
          format: int32
        held:
          type: integer
          format: int32

    Durations:
      description: How long issues took, in days.
      type: object
      required: [samples, p50, p85]
      properties:
        samples:
          type: integer
          format: int32
          description: How many completed issues the figures come from.
        p50:
          type: number
          format: double
        p85:
          type: number
          format: double
        p95:
          type: number
          format: double

    TeamInsights:
      type: object
      required: [weeks, cycleTime, leadTime, flow, calibration]
      properties:
        weeks:
          type: array
          description: The last twelve weeks, oldest first; the last is the current, unfinished one.
          items:
            type: object
            required: [start, created, completed]
            properties:
              start:
                type: string
                format: date
                description: The Monday the week starts on (UTC).
              created:
                type: integer
                format: int32
              completed:
                type: integer
                format: int32
        cycleTime:
          $ref: "#/components/schemas/Durations"
        leadTime:
          $ref: "#/components/schemas/Durations"
        flow:
          type: array
          description: How many issues were in each kind of status at the end of each week, oldest first.
          items:
            type: object
            required: [date, backlog, unstarted, started, completed, canceled]
            properties:
              date:
                type: string
                format: date
              backlog:
                type: integer
                format: int32
              unstarted:
                type: integer
                format: int32
              started:
                type: integer
                format: int32
              completed:
                type: integer
                format: int32
              canceled:
                type: integer
                format: int32
        calibration:
          $ref: "#/components/schemas/Calibration"

    Forecast:
      type: object
      required: [remaining, completed, weeklyCompleted, enoughHistory, diverging, calibration]
      properties:
        remaining:
          type: integer
          format: int32
          description: Open issues in scope.
        completed:
          type: integer
          format: int32
        weeklyCompleted:
          type: array
          description: Issues completed in each of the last twelve full weeks, oldest first. The forecast draws on these.
          items:
            type: integer
            format: int32
        enoughHistory:
          type: boolean
          description: False when too little has been completed to forecast from; the dates are then absent.
        diverging:
          type: boolean
          description: True when work is being added about as fast as it is completed, so no end is in sight.
        p50:
          type: string
          format: date
          description: As likely as not to be done by this date.
        p85:
          type: string
          format: date
        p95:
          type: string
          format: date
        targetDate:
          type: string
          format: date
          description: "The date it is meant to be done by: the project's or milestone's target, or the cycle's end."
        onTimeProbability:
          type: number
          format: double
          description: The chance, from 0 to 1, of being done by the target date.
        calibration:
          $ref: "#/components/schemas/Calibration"

