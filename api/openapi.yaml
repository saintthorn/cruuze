        row names the columns; `Title` is required, and `Description`,
        `Status`, `Priority`, `Assignee`, `Labels` and `Due date`
        are used when present. Labels that don't exist yet are created.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
