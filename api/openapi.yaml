        `X-Hub-Signature-256` header. Pull request events link the pull request
        to the issues named in its branch, title or description.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Accepted.
        default:
          $ref: "#/components/responses/Error"

