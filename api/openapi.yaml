            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/imports:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listImports
      description: The workspace's imports, newest first. Admins only.
      responses:
        "200":
          description: The imports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Import"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startImport
      description: |
        Starts an import, which then runs on the server. Poll the import for
        its progress. Running the same import again updates what the first
        run made rather than duplicating it. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/imports/preview:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: previewImport
      description: Connects to the source and says which teams and people it has, without importing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: What is there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/imports/connections:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listImportConnections
      description: |
        Which trackers this server can connect to through their own sign-in
        pages, and which of them the caller has connected. A connection is
        its admin's alone. To make one, send the browser to
        /api/workspaces/{workspaceId}/imports/connect/{provider}. Admins only.
      responses:
        "200":
          description: The connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConnections"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/imports/connections/github/repos:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listImportConnectionRepos
      description: The repositories with issues that the caller's GitHub connection can read, most recently pushed first.
      responses:
        "200":
          description: Repositories, as owner/name.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/imports/connections/{provider}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ImportProvider"
    delete:
      operationId: deleteImportConnection
      description: Forgets the caller's connection to a tracker.
      responses:
        "204":
          description: Forgotten.
        default:
          $ref: "#/components/responses/Error"

  /imports/{importId}:
    parameters:
      - name: importId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getImport
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        default:
          $ref: "#/components/responses/Error"

  /imports/{importId}/undo:
    parameters:
      - name: importId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: undoImport
      description: Removes what the import created. What it only matched or updated stays.
      responses:
        "200":
          description: Undone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cruuze_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "An API key, sent as `Authorization: Bearer cruuze_...`. It acts as its owner within one workspace."

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`.
        message:
          type: string

    SignupMode:
      type: string
      description: "Who may make an account: anyone, people invited to a workspace, or also addresses at the listed domains."
      enum: [open, invited, domains]

    AuthConfig:
      type: object
      required: [google, signup, version]
      properties:
        google:
          type: boolean
        signup:
          $ref: "#/components/schemas/SignupMode"
        version:
          type: string

    InstanceSettings:
      type: object
      description: Settings and a few counts for the whole install, for whoever runs it.
      required: [version, signup, signupDomains, workspaceCreation, users, workspaces, issues, admins]
      properties:
        version:
          type: string
        signup:
          $ref: "#/components/schemas/SignupMode"
        signupDomains:
          type: array
          items:
            type: string
        workspaceCreation:
          type: string
          enum: [anyone, admins]
          description: Who may create workspaces.
        users:
          type: integer
          format: int64
        workspaces:
          type: integer
          format: int64
        issues:
          type: integer
          format: int64
        admins:
          type: array
          description: Addresses of the people who administer the install.
          items:
            type: string

    UpdateInstanceRequest:
      type: object
      properties:
        signup:
          $ref: "#/components/schemas/SignupMode"
        signupDomains:
          type: array
          items:
            type: string
        workspaceCreation:
          type: string
          enum: [anyone, admins]

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        portal:
          type: string
          description: URL key of a workspace whose portal the link should lead back to.

    VerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        createdAt:
          type: string
          format: date-time

    WorkspaceRole:
      type: string
      enum: [admin, member, guest]

    Workspace:
      type: object
      required: [id, name, urlKey, role, portalEnabled, portalPublicBoard, portalIntro, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        urlKey:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        portalEnabled:
          type: boolean
          description: Whether customers can send requests at /portal/{urlKey}.
        portalPublicBoard:
          type: boolean
          description: Whether requests marked public are listed on the portal for votes.
        portalIntro:
          type: string
        createdAt:
          type: string
          format: date-time

    Me:
      type: object
      required: [user, workspaces, emailNotifications, githubLogin, instanceAdmin, canCreateWorkspace]
      properties:
        user:
          $ref: "#/components/schemas/User"
        instanceAdmin:
          type: boolean
          description: Whether the user administers this install.
        canCreateWorkspace:
          type: boolean
        emailNotifications:
          type: boolean
          description: Whether unread notifications are also sent by email.
        githubLogin:
          type: string
          description: "The user's GitHub username, so their GitHub activity is credited to them. Empty if not given."
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"

    UpdateMeRequest:
      type: object
      properties:
        name:
          type: string
        emailNotifications:
          type: boolean
        githubLogin:
          type: string
          description: Empty clears it.

    UpdateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/WorkspaceRole"

    CreateWorkspaceRequest:
      type: object
      required: [name, urlKey]
      properties:
        name:
          type: string
        urlKey:
          type: string
          description: Lowercase letters, digits and dashes; 3-32 characters.

    WorkspaceMember:
      type: object
      required: [user, role, joinedAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        joinedAt:
          type: string
          format: date-time

    WorkspaceInvite:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        createdAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"

    Team:
      type: object
      required: [id, workspaceId, name, key, private, isMember, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Issue identifier prefix, e.g. `ENG`.
        private:
          type: boolean
        isMember:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TeamKind:
      type: string
      description: What sort of team it is. Decides the workflow a new team starts with and which pages the app offers it.
      enum: [engineering, support, marketing, design, general]

    CreateTeamRequest:
      type: object
      required: [name, key]
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/TeamKind"
        key:
          type: string
          description: Uppercase letters and digits, starting with a letter; 1-7 characters.
        private:
          type: boolean

    UserRecord:
      description: A workspace member, as synced to clients.
      type: object
      required: [id, email, name, role, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        joinedAt:
          type: string
          format: date-time

    TeamRecord:
      description: A team, as synced to clients.
      type: object
      required: [id, name, key, kind, private, cycleWeeks, triageEnabled, autoArchiveDays, staleDays, autoCloseDays, autoCloseParent, autoAssign, autoCycle, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
        kind:
          $ref: "#/components/schemas/TeamKind"
        private:
          type: boolean
        autoArchiveDays:
          type: integer
          format: int32
          description: Closed issues are archived after this many days; 0 never archives.
        staleDays:
          type: integer
          format: int32
          description: Open issues untouched for this many days are flagged for cleanup; 0 flags nothing.
        autoCloseDays:
          type: integer
          format: int32
          description: Unstarted issues untouched for this many days are canceled; 0 never cancels.
        autoCloseParent:
          type: boolean
          description: A parent issue is completed when its last open sub-issue is closed.
        autoAssign:
          type: boolean
          description: Whoever starts an unassigned issue becomes its assignee.
        autoCycle:
          type: boolean
          description: "An issue that is started joins the team's current cycle."
        reviewStateId:
          type: string
          format: uuid
          description: Where an issue goes when its pull request asks for review. Absent leaves it be.
        cycleWeeks:
          type: integer
          format: int32
          description: Length of the team's cycles in weeks; 0 means cycles are off.
        triageEnabled:
          type: boolean
          description: Whether issues from people outside the team wait in triage first.
        createdAt:
          type: string
          format: date-time

    TeamMemberRecord:
      type: object
      required: [teamId, userId]
      properties:
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid

    WorkflowStateType:
      type: string
      enum: [triage, backlog, unstarted, started, completed, canceled]

    WorkflowState:
      type: object
      required: [id, teamId, name, type, color, position]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/WorkflowStateType"
        color:
          type: string
        position:
          type: number
          format: double

    Issue:
      type: object
      required: [id, teamId, number, title, description, stateId, priority, sortOrder, labelIds, subscriberIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
          description: Sequential within the team; shown as `KEY-number`.
        title:
          type: string
        description:
          type: string
        stateId:
          type: string
          format: uuid
        priority:
          type: integer
          format: int32
          description: 0 none, 1 urgent, 2 high, 3 medium, 4 low.
        assigneeId:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        sortOrder:
          type: number
          format: double
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        projectId:
          type: string
          format: uuid
        milestoneId:
          type: string
          format: uuid
        cycleId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: The issue this one is a sub-issue of.
        subscriberIds:
          type: array
          description: Users notified about changes to the issue.
          items:
            type: string
            format: uuid
        dueDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          description: When work first began (the issue first entered a started status).
        completedAt:
          type: string
          format: date-time
          description: When the issue was completed or canceled. Absent while it is open.
        loggedSeconds:
          type: integer
          format: int32
          description: "Time logged on the issue, by everyone, in seconds."

    CreateIssueRequest:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
          description: Chosen by the client so retries are idempotent.
        title:
          type: string
        description:
          type: string
        stateId:
          type: string
          format: uuid
          description: Defaults to the team's backlog state.
        priority:
          type: integer
          format: int32
        assigneeId:
          type: string
          format: uuid
        sortOrder:
          type: number
          format: double
          description: Defaults to the top of the team's list.
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        dueDate:
          type: string
          format: date
        projectId:
          type: string
          format: uuid
        milestoneId:
          type: string
          format: uuid
        cycleId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid

    UpdateIssueRequest:
      type: object
      properties:
        touch:
          type: boolean
          description: |
            Marks the issue as looked at and still wanted, without changing
            it: it stops counting as stale. Ignored alongside other changes,
            which have the same effect.
        title:
          type: string
        description:
          type: string
        stateId:
          type: string
          format: uuid
        priority:
          type: integer
          format: int32
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: Pass null to unassign.
        sortOrder:
          type: number
          format: double
        addLabelIds:
          type: array
          description: Labels to add. Adding and removing, rather than replacing the set, lets concurrent edits combine.
          items:
            type: string
            format: uuid
        removeLabelIds:
          type: array
          items:
            type: string
            format: uuid
        dueDate:
          type: string
          format: date
          nullable: true
          description: Pass null to clear.
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Pass null to remove from its project. Changing project clears the milestone.
        milestoneId:
          type: string
          format: uuid
          nullable: true
        cycleId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true

    IssueMutationResult:
      type: object
      required: [issue, syncId]
      properties:
        issue:
          $ref: "#/components/schemas/Issue"
        syncId:
          type: integer
          format: int64
          description: The change is reflected once the client has applied this sync ID.

    Label:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          description: Hex color, e.g. `#5e6ad2`.

    CreateLabelRequest:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
          description: Chosen by the client so retries are idempotent.
        name:
          type: string
        color:
          type: string

    UpdateLabelRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    LabelMutationResult:
      type: object
      required: [label, syncId]
      properties:
        label:
          $ref: "#/components/schemas/Label"
        syncId:
          type: integer
          format: int64

    SyncAck:
      type: object
      required: [syncId]
      properties:
        syncId:
          type: integer
          format: int64
          description: The change is reflected once the client has applied this sync ID.

    Comment:
      type: object
      required: [id, issueId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        issueId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: The author; absent if their account was deleted.
        body:
          type: string
          description: Markdown. Mentions are links to `mention://user/{userId}`.
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string

    UpdateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string

    CommentMutationResult:
      type: object
      required: [comment, syncId]
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
        syncId:
          type: integer
          format: int64

    Reaction:
      type: object
      required: [commentId, userId, emoji]
      properties:
        commentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        emoji:
          type: string

    ActivityType:
      type: string
      enum: [created, title, description, state, priority, assignee, labels, dueDate, project, milestone, cycle, parent, archived, unarchived, reviewed]

    Activity:
      description: One change to an issue, for its activity feed.
      type: object
      required: [id, issueId, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        issueId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ActivityType"
        from:
          type: string
          description: The previous value (an ID, number or date as text); absent if there was none.
        to:
          type: string
        addedLabelIds:
          type: array
          items:
            type: string
            format: uuid
        removedLabelIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time

    NotificationType:
      type: string
      enum: [assigned, mentioned, commented, status]

    Notification:
      description: Something that happened on an issue the recipient follows. Only the recipient sees it.
      type: object
      required: [id, type, issueId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        issueId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        commentId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time

    UpdateNotificationRequest:
      type: object
      required: [read]
      properties:
        read:
          type: boolean

    Attachment:
      type: object
      required: [id, issueId, filename, contentType, size, createdAt]
      properties:
        id:
          type: string
          format: uuid
        issueId:
          type: string
          format: uuid
        uploaderId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    AttachmentMutationResult:
      type: object
      required: [attachment, syncId]
      properties:
        attachment:
          $ref: "#/components/schemas/Attachment"
        syncId:
          type: integer
          format: int64

    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/TeamKind"
        cycleWeeks:
          type: integer
          format: int32
        triageEnabled:
          type: boolean
        private:
          type: boolean
          description: Only a member of the team can make it private.
        autoArchiveDays:
          type: integer
          format: int32
          description: Closed issues are archived after this many days; 0 never archives.
        staleDays:
          type: integer
          format: int32
        autoCloseDays:
          type: integer
          format: int32
        autoCloseParent:
          type: boolean
        autoAssign:
          type: boolean
        autoCycle:
          type: boolean
        reviewStateId:
          type: string
          format: uuid
          nullable: true
          description: "One of the team's started statuses, or null for none."

    TeamMutationResult:
      type: object
      required: [team, syncId]
      properties:
        team:
          $ref: "#/components/schemas/TeamRecord"
        syncId:
          type: integer
          format: int64

    ProjectStatus:
      type: string
      enum: [backlog, planned, started, paused, completed, canceled]

    Project:
      type: object
      required: [id, name, description, status, color, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
