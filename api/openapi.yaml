          $ref: "#/components/responses/Error"
    put:
      operationId: enableGithubIntegration
      description: Connects GitHub, or replaces the secret if it already is connected.
      responses:
        "200":
          description: The integration with its new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubIntegration"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disableGithubIntegration
      responses:
        "204":
          description: GitHub events are no longer accepted. Linked pull requests stay.
