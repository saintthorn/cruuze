        "200":
          description: It already existed (a retried request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

