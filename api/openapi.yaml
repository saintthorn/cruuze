openapi: 3.0.3
info:
  title: Cruuze API
  version: 0.1.0
servers:
  - url: /api
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/config:
    get:
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: Which sign-in methods are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /auth/magic-link:
    post:
      operationId: requestMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "204":
          description: A sign-in email was sent if the address is deliverable.
        default:
          $ref: "#/components/responses/Error"

  /auth/verify:
    post:
      operationId: verifyMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Signed in. Sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"

  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The signed-in user and their workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /workspaces:
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: The new workspace. A first team is created with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    patch:
      operationId: updateWorkspace
      description: Renames the workspace. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWorkspaceMember
      description: "Changes a member's role. Admins only; the last admin can't be demoted."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeWorkspaceMember
      description: |
        Removes a member from the workspace and from its teams. Admins can
        remove anyone; anyone can remove themselves (leave). The last admin
        can't be removed. What the person wrote stays.
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceMembers
      responses:
        "200":
          description: Members of the workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceInvites
      responses:
        "200":
          description: Pending invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceInvite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createWorkspaceInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite. It is accepted when that email signs in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvite"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteWorkspaceInvite
      responses:
        "204":
          description: Invite revoked.
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/teams:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listTeams
      responses:
        "200":
          description: Teams visible to the signed-in user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: The new team. The creator is its first member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Error"

  /teams/{teamId}/members:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listTeamMembers
      responses:
        "200":
          description: Members of the team.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /teams/{teamId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: addTeamMember
      responses:
        "204":
          description: The user is a member of the team.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeTeamMember
      responses:
        "204":
          description: The user is no longer a member of the team.
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/sync/bootstrap:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getSyncBootstrap
      description: |
        A consistent snapshot of every synced record the caller can see, plus
        the sync ID it is current as of. Clients then open the WebSocket at
        `/workspaces/{workspaceId}/sync/ws?after={lastSyncId}`, which sends
        `SyncMessage` frames with every later change.
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncBootstrap"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/labels:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createLabel
      description: |
        Creates a label with a client-chosen ID. Repeating the request with
        the same ID returns the existing label, so it is safe to retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelRequest"
      responses:
        "200":
          description: The label already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelMutationResult"
        "201":
          description: The new label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /labels/{labelId}:
    parameters:
      - name: labelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLabelRequest"
      responses:
        "200":
          description: The updated label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLabel
      description: Deletes the label and removes it from every issue.
      responses:
        "200":
          description: The label is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /teams/{teamId}/issues:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      operationId: createIssue
      description: |
        Creates an issue with a client-chosen ID. Repeating the request with
        the same ID returns the existing issue, so it is safe to retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "200":
          description: The issue already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        "201":
          description: The new issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    patch:
      operationId: updateIssue
      description: Updates only the fields present in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: The updated issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: archiveIssue
      responses:
        "200":
          description: The issue is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /issues/{issueId}/details:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    get:
      operationId: getIssueDetails
      description: |
        The issue's comments, reactions and activity. The bootstrap leaves
        these out; clients fetch them when an issue is opened and keep them
        current from the sync socket afterwards.
      responses:
        "200":
          description: Everything as of `syncId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetails"
        default:
          $ref: "#/components/responses/Error"

  /issues/{issueId}/subscription:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    put:
      operationId: subscribeToIssue
      description: Subscribes the caller to notifications about the issue.
      responses:
        "200":
          description: The issue, with the caller among its subscribers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unsubscribeFromIssue
      responses:
        "200":
          description: The issue, without the caller among its subscribers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      operationId: createComment
      description: |
        Adds a comment with a client-chosen ID; repeating the request returns
        the existing comment. The author and anyone mentioned are subscribed
        to the issue, and its subscribers are notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "200":
          description: The comment already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentMutationResult"
        "201":
          description: The new comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /issues/{issueId}/attachments:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      operationId: uploadAttachment
      description: Uploads a file (up to 25 MB) to the issue.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The stored attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    patch:
      operationId: updateComment
      description: Only the author can edit a comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "200":
          description: The edited comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteComment
      description: The author or a workspace admin can delete a comment.
      responses:
        "200":
          description: The comment is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /comments/{commentId}/reactions/{emoji}:
    parameters:
      - $ref: "#/components/parameters/CommentId"
      - name: emoji
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: addReaction
      responses:
        "200":
          description: The caller's reaction is on the comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeReaction
      responses:
        "200":
          description: The caller's reaction is off the comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationRequest"
      responses:
        "200":
          description: The notification is marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteNotification
      responses:
        "200":
          description: The notification is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadAttachment
      responses:
        "200":
          description: The file. Images are served inline; everything else as a download.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAttachment
      description: The uploader or a workspace admin can delete an attachment.
      responses:
        "200":
          description: The attachment is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    patch:
      operationId: updateTeam
      description: "Changes a team's name, privacy, cycle length or triage setting."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeam
      description: |
        Deletes a team with everything it owns: its issues, comments, statuses,
        cycles and memberships. Admins only. It cannot be undone, and every
        client of the workspace loads it afresh.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: It already existed (a retried request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResult"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      description: Deletes the project and its milestones. Its issues stay, without a project.
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/milestones:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMilestoneRequest"
      responses:
        "200":
          description: It already existed (a retried request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneMutationResult"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /milestones/{milestoneId}:
    parameters:
      - name: milestoneId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMilestoneRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMilestone
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /issues/{issueId}/relations:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      operationId: createRelation
      description: "Relates this issue to another: it blocks, duplicates or relates to it."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationRequest"
      responses:
        "200":
          description: It already existed (a retried request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationMutationResult"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /relations/{relationId}:
    parameters:
      - name: relationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteRelation
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /teams/{teamId}/templates:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "200":
          description: It already existed (a retried request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateMutationResult"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateMutationResult"
        default:
          $ref: "#/components/responses/Error"

  /templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateMutationResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTemplate
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        default:
          $ref: "#/components/responses/Error"

  /workspaces/{workspaceId}/views:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateViewRequest"
      responses:
        "200":
          description: It already existed (a retried request).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewMutationResult"
        "201":
          description: Created.
          content:
            application/json:
