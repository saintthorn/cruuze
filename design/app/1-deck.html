<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruuze app mockup 1: Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=JetBrains+Mono:wght@400..700&family=Roboto:wght@400..700&family=EB+Garamond:wght@400..700&family=Cinzel:wght@500..800&family=Exo+2:wght@400..700&family=Orbitron:wght@500..800&display=swap" rel="stylesheet">
<style>
  :root, [data-theme='midnight'] { --bg:#08090c; --rail:#050608; --panel:#0f1014; --hover:#15161c; --active:#1d1e26; --line:#1a1b22; --line-2:#2b2c36; --fg:#f4f2ec; --muted:#a3a09a; --faint:#6a6862; --accent:#dc2b3d; --accent-2:#a8321f; --accent-fg:#fff8f5; --ok:#3ecf8e; --warn:#f0b35a; --font:'Geist',ui-sans-serif,system-ui,sans-serif; --display:var(--font); --r:14px; --glow:rgb(220 43 61 / .22); --caps:none; --track:-.015em; color-scheme:dark; }
  [data-theme='hacker'] { --bg:#0a0d0c; --rail:#070909; --panel:#0e1311; --hover:#121816; --active:#17201c; --line:#18211d; --line-2:#25332d; --fg:#c4e3d0; --muted:#7c988a; --faint:#4c6257; --accent:#2fe07f; --accent-2:#1c9a55; --accent-fg:#04140b; --ok:#2fe07f; --warn:#e5b567; --font:'JetBrains Mono',ui-monospace,Menlo,monospace; --display:var(--font); --r:3px; --glow:rgb(47 224 127 / .12); --caps:none; --track:0; color-scheme:dark; }
  [data-theme='material'] { --bg:#f0f4f9; --rail:#e4eaf3; --panel:#ffffff; --hover:#e9eef6; --active:#d3e3fd; --line:#e1e3e8; --line-2:#c4c7c5; --fg:#1f1f1f; --muted:#444746; --faint:#747775; --accent:#0b57d0; --accent-2:#0842a0; --accent-fg:#ffffff; --ok:#146c2e; --warn:#9a5b00; --font:'Roboto',ui-sans-serif,system-ui,sans-serif; --display:var(--font); --r:20px; --glow:rgb(11 87 208 / .1); --caps:none; --track:0; color-scheme:light; }
  [data-theme='quest'] { --bg:#e9dab8; --rail:#dfcda3; --panel:#f6ecd4; --hover:#e2d0a6; --active:#d6bf8c; --line:#cdb887; --line-2:#a68a52; --fg:#2a1b0c; --muted:#5c4729; --faint:#86704a; --accent:#8c1c13; --accent-2:#5e120c; --accent-fg:#f8ecd0; --ok:#3a6a2c; --warn:#8f5f00; --font:'EB Garamond',Palatino,Georgia,serif; --display:'Cinzel','EB Garamond',serif; --r:5px; --glow:rgb(176 132 42 / .25); --caps:none; --track:.01em; color-scheme:light; }
  [data-theme='hyperdrive'] { --bg:#05070d; --rail:#03050a; --panel:#0a101c; --hover:#0f1828; --active:#15233b; --line:#13203a; --line-2:#214070; --fg:#cfe8ff; --muted:#7f9fc6; --faint:#4a658c; --accent:#ffb62e; --accent-2:#c9781a; --accent-fg:#1a1000; --ok:#5ef2c0; --warn:#ff8f3d; --font:'Exo 2',ui-sans-serif,system-ui,sans-serif; --display:'Orbitron','Exo 2',sans-serif; --r:0px; --glow:rgb(79 216 255 / .16); --caps:uppercase; --track:.02em; color-scheme:dark; }
  [data-theme='quest'] body { font-size: 16.5px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: radial-gradient(ellipse 70% 50% at 50% -10%, var(--glow), transparent 70%), var(--bg); color: var(--fg); font: 14px/1.45 var(--font); letter-spacing: var(--track); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background .5s, color .3s; }
  button { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; letter-spacing: inherit; }
  .mono { font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0; }
  h1, h2, h3 { font-family: var(--display); text-transform: var(--caps); }
  .themes { align-items: center; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line-2); border-radius: 999px; bottom: 16px; box-shadow: 0 18px 40px -18px #000; display: flex; gap: 6px; padding: 6px 8px 6px 14px; position: fixed; right: 16px; z-index: 50; }
  .themes span { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .themes button { border: 2px solid transparent; border-radius: 50%; height: 22px; transition: transform .2s; width: 22px; }
  .themes button:hover { transform: scale(1.15); }
  .themes button[aria-pressed='true'] { border-color: var(--fg); }

  .app { display: grid; gap: 12px; grid-template: 56px 1fr / 60px 1fr; height: 100%; padding: 12px; }
  .glass { backdrop-filter: blur(16px); background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line); border-radius: var(--r); }
  .top { align-items: center; display: flex; gap: 14px; grid-column: 1 / -1; padding: 0 10px 0 16px; }
  .mark { height: 24px; width: 24px; }
  .ws { align-items: center; border-radius: calc(var(--r) * .7); display: flex; font-weight: 600; gap: 8px; padding: 6px 10px; }
  .ws:hover { background: var(--hover); }
  .ws small { color: var(--faint); font-weight: 400; }
  .cmd { align-items: center; background: var(--bg); border: 1px solid var(--line-2); border-radius: 999px; color: var(--faint); display: flex; flex: 1; gap: 10px; height: 38px; margin: 0 auto; max-width: 560px; padding: 0 8px 0 14px; transition: border-color .2s, box-shadow .2s; }
  .cmd:hover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .cmd kbd { background: var(--hover); border-radius: 6px; color: var(--muted); font: 11px 'Geist Mono', ui-monospace, monospace; margin-left: auto; padding: 3px 7px; }
  .seg { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; display: flex; padding: 3px; }
  .seg button { border-radius: 999px; color: var(--muted); font-size: 13px; padding: 5px 13px; transition: background .2s, color .2s; }
  .seg button[aria-pressed='true'] { background: var(--active); color: var(--fg); }
  .new { align-items: center; background: linear-gradient(160deg, var(--accent), var(--accent-2)); border-radius: 999px; box-shadow: 0 8px 20px -10px var(--accent); color: var(--accent-fg); display: flex; font-weight: 600; gap: 6px; height: 36px; padding: 0 16px 0 12px; transition: transform .2s; }
  .new:hover { transform: translateY(-1px); }
  .rail { align-items: center; display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
  .rail button { align-items: center; border-radius: calc(var(--r) * .7); color: var(--muted); display: flex; height: 40px; justify-content: center; position: relative; transition: background .2s, color .2s; width: 40px; }
  .rail button:hover { background: var(--hover); color: var(--fg); }
  .rail button[aria-current] { background: var(--active); color: var(--fg); }
  .rail button[aria-current]::before { background: var(--accent); border-radius: 2px; content: ''; height: 18px; left: -10px; position: absolute; width: 3px; }
  .rail b { background: var(--accent); border-radius: 99px; color: var(--accent-fg); font-size: 10px; min-width: 16px; padding: 0 4px; position: absolute; right: 1px; top: 1px; }
  .rail .me { background: var(--active); border: 1px solid var(--line-2); border-radius: 50%; font-size: 12px; font-weight: 600; height: 34px; margin-top: auto; width: 34px; }
  .work { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .cycle { align-items: center; border-bottom: 1px solid var(--line); display: flex; gap: 18px; padding: 16px 20px; }
  .cycle h1 { font-size: 17px; font-weight: 600; }
  .cycle p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .meter { background: var(--hover); border-radius: 99px; flex: 1; height: 6px; overflow: hidden; }
  .meter i { background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; display: block; height: 100%; width: 62%; }
  .stat { text-align: right; }
  .stat b { display: block; font-size: 16px; font-weight: 600; }
  .stat span { color: var(--faint); font-size: 11.5px; }
  .scroll { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; }
  .grp { align-items: center; color: var(--muted); display: flex; font-size: 12px; font-weight: 600; gap: 8px; padding: 14px 12px 6px; }
  .grp i { border-radius: 50%; height: 8px; width: 8px; }
  .grp span { color: var(--faint); font-weight: 400; }
  .item { align-items: center; border: 1px solid transparent; border-radius: calc(var(--r) * .8); display: flex; gap: 12px; padding: 11px 12px; position: relative; text-align: left; transition: background .18s, border-color .18s, transform .18s; width: 100%; }
  .item:hover { background: var(--hover); transform: translateX(2px); }
  .item[aria-selected='true'] { background: var(--active); border-color: var(--line-2); box-shadow: inset 3px 0 0 var(--accent); }
  .item .id { color: var(--faint); font-size: 12px; width: 58px; }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { align-items: center; border: 1px solid var(--line-2); border-radius: 999px; color: var(--muted); display: inline-flex; font-size: 11.5px; gap: 5px; padding: 2px 9px; white-space: nowrap; }
  .tag svg { height: 12px; width: 12px; }
  .av { align-items: center; background: color-mix(in srgb, var(--accent) 22%, var(--panel)); border-radius: 50%; display: inline-flex; flex: none; font-size: 10px; font-weight: 700; height: 24px; justify-content: center; width: 24px; }
  .peek { animation: slide .35s cubic-bezier(.2,.7,.2,1); padding: 22px 24px; }
  @keyframes slide { from { opacity: 0; transform: translateX(14px); } }
  .peek .id { color: var(--faint); font-size: 12.5px; }
  .peek h2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; margin-top: 6px; }
  .props { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .prop { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; padding: 5px 12px; }
  .prop span { color: var(--faint); margin-right: 6px; }
  .peek > p { color: var(--muted); margin-top: 18px; }
  .peek h3 { color: var(--faint); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; margin-top: 26px; text-transform: uppercase; }
  .line { border-left: 1px solid var(--line-2); margin: 12px 0 0 6px; padding-left: 18px; }
  .ev { color: var(--muted); font-size: 13px; padding: 7px 0; position: relative; }
  .ev::before { background: var(--panel); border: 2px solid var(--line-2); border-radius: 50%; content: ''; height: 9px; left: -24px; position: absolute; top: 11px; width: 9px; }
  .ev.hot::before { border-color: var(--accent); }
  .ev b { color: var(--fg); font-weight: 500; }
  .say { align-items: center; background: var(--bg); border: 1px solid var(--line-2); border-radius: calc(var(--r) * .8); color: var(--faint); display: flex; justify-content: space-between; margin: auto 24px 20px; padding: 12px 14px; }
  .status { align-items: center; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line-2); border-radius: 999px; bottom: 16px; color: var(--muted); display: flex; font-size: 12px; gap: 10px; left: 84px; padding: 7px 14px; position: fixed; }
  .status i { background: var(--ok); border-radius: 50%; box-shadow: 0 0 8px var(--ok); height: 7px; width: 7px; }
  @media (max-width: 900px) { .work { grid-template-columns: 1fr; } .work .pane:last-child, .seg, .stat { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top glass">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M29 9c15 11 23 23 26 37H13z" fill="var(--fg)" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round"/><path d="M11 56h44" fill="none" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round"/></svg>
    <button class="ws">Acme <small>/ Engineering</small></button>
    <button class="cmd"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search, jump or run a command</span><kbd>⌘K</kbd></button>
    <div class="seg" role="group" aria-label="View"><button aria-pressed="true">List</button><button aria-pressed="false">Board</button><button aria-pressed="false">Timeline</button></div>
    <button class="new"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New issue</button>
  </header>
  <nav class="rail glass" aria-label="Workspace"><button aria-label="Inbox"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg><b>4</b></button><button aria-label="Focus"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></button><button aria-label="Issues" aria-current=page><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5.5"/></svg></button><button aria-label="Cycles"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/></svg></button><button aria-label="Roadmap"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M8 12h12M4 18h7"/></svg></button><button aria-label="Insights"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button><button class="me" aria-label="Account">AL</button></nav>
  <main class="work">
    <section class="pane glass">
      <div class="cycle"><div><h1>Cycle 14</h1><p>6 days left</p></div><div class="meter"><i></i></div>
        <div class="stat"><b>62%</b><span>done</span></div><div class="stat"><b>Oct 16</b><span>85% forecast</span></div></div>
      <div class="scroll" role="listbox" aria-label="Issues"><div class="grp"><i style="background:var(--warn)"></i>In Progress<span>2</span></div><button class="item" role="option" aria-selected="true" data-id="ENG-142"><span class="id mono">ENG-142</span><span class="t">Outbox survives a reload</span><span class="tag"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-10.5 6"/></svg>eng-142-outbox</span><span class="av">AL</span></button><button class="item" role="option" aria-selected="false" data-id="ENG-145"><span class="id mono">ENG-145</span><span class="t">Batch edits, one request</span><span class="tag"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-10.5 6"/></svg>review requested</span><span class="av">GH</span></button><div class="grp"><i style="background:var(--faint)"></i>Todo<span>3</span></div><button class="item" role="option" aria-selected="false" data-id="ENG-143"><span class="id mono">ENG-143</span><span class="t">Forecast from history</span><span class="av">KJ</span></button><button class="item" role="option" aria-selected="false" data-id="ENG-144"><span class="id mono">ENG-144</span><span class="t">Notify requesters on ship</span><span class="av">MR</span></button><button class="item" role="option" aria-selected="false" data-id="ENG-146"><span class="id mono">ENG-146</span><span class="t">Lazy-load board columns</span><span class="av">AL</span></button><div class="grp"><i style="background:var(--ok)"></i>Done<span>1</span></div><button class="item" role="option" aria-selected="false" data-id="ENG-139"><span class="id mono">ENG-139</span><span class="t">Signed webhooks</span><span class="tag"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-10.5 6"/></svg>merged</span><span class="av">GH</span></button></div>
    </section>
    <section class="pane glass" id="peek" aria-live="polite"></section>
  </main>
</div>
<div class="status"><i></i>Live<span>·</span>Synced<span>·</span>0 queued</div>
<div class="themes" role="group" aria-label="Theme"><span id="theme-name">mode=midnight</span>
  <button data-set="midnight" aria-label="mode=midnight" style="background:linear-gradient(135deg,#08090c 50%,#dc2b3d 50%)"></button>
  <button data-set="hacker" aria-label="mode=hacker" style="background:linear-gradient(135deg,#0a0d0c 50%,#2fe07f 50%)"></button>
  <button data-set="material" aria-label="mode=material" style="background:linear-gradient(135deg,#ffffff 50%,#0b57d0 50%)"></button>
  <button data-set="quest" aria-label="mode=quest" style="background:linear-gradient(135deg,#efe2c4 50%,#8c1c13 50%)"></button>
  <button data-set="hyperdrive" aria-label="mode=hyperdrive" style="background:linear-gradient(135deg,#05070d 50%,#ffb62e 50%)"></button>
</div>
<script>
  const setTheme = (id) => {
    document.documentElement.dataset.theme = id
    document.getElementById('theme-name').textContent = 'mode=' + id
    document.querySelectorAll('.themes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.set === id)))
  }
  document.querySelectorAll('.themes button').forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.set)))
  setTheme('midnight')
</script>
<script>
  const PEEKS = {"ENG-142": "<div class=\"peek\"><span class=\"id mono\">ENG-142</span><h2>Outbox survives a reload</h2><div class=\"props\"><span class=\"prop\"><span>Status</span>In Progress</span><span class=\"prop\"><span>Assignee</span>AL</span><span class=\"prop\"><span>Cycle</span>14</span><span class=prop><span>Branch</span>eng-142-outbox</span></div><p>Queued changes are lost if the tab reloads before they are sent. Keep the outbox in the local database and replay it on start.</p><h3>Activity</h3><div class=\"line\"><div class=\"ev hot\"><b>Ada</b> pushed <b>eng-142-outbox</b><br><span style=\"color:var(--faint)\">moved to In Progress</span></div><div class=\"ev \"><b>Ada</b> started a timer<br><span style=\"color:var(--faint)\">1h 20m so far</span></div><div class=\"ev \"><b>Kim</b> commented<br><span style=\"color:var(--faint)\">\u201cRepro attached.\u201d</span></div></div></div><div class=\"say\"><span>Comment\u2026</span><kbd class=\"mono\">\u2318\u23ce</kbd></div>", "ENG-145": "<div class=\"peek\"><span class=\"id mono\">ENG-145</span><h2>Batch edits, one request</h2><div class=\"props\"><span class=\"prop\"><span>Status</span>In Progress</span><span class=\"prop\"><span>Assignee</span>GH</span><span class=\"prop\"><span>Cycle</span>14</span><span class=prop><span>Branch</span>review requested</span></div><p>Editing forty issues sends forty requests. Send them as one.</p><h3>Activity</h3><div class=\"line\"><div class=\"ev hot\"><b>Grace</b> requested review<br><span style=\"color:var(--faint)\">moved to In Review</span></div><div class=\"ev \"><b>Grace</b> opened a pull request<br><span style=\"color:var(--faint)\">linked</span></div></div></div><div class=\"say\"><span>Comment\u2026</span><kbd class=\"mono\">\u2318\u23ce</kbd></div>", "ENG-143": "<div class=\"peek\"><span class=\"id mono\">ENG-143</span><h2>Forecast from history</h2><div class=\"props\"><span class=\"prop\"><span>Status</span>Todo</span><span class=\"prop\"><span>Assignee</span>KJ</span><span class=\"prop\"><span>Cycle</span>14</span></div><p>Replace the estimate field with a forecast built from how long similar issues took.</p><h3>Activity</h3><div class=\"line\"><div class=\"ev \"><b>Kim</b> created the issue<br><span style=\"color:var(--faint)\">2 days ago</span></div></div></div><div class=\"say\"><span>Comment\u2026</span><kbd class=\"mono\">\u2318\u23ce</kbd></div>", "ENG-144": "<div class=\"peek\"><span class=\"id mono\">ENG-144</span><h2>Notify requesters on ship</h2><div class=\"props\"><span class=\"prop\"><span>Status</span>Todo</span><span class=\"prop\"><span>Assignee</span>MR</span><span class=\"prop\"><span>Cycle</span>14</span></div><p>When an issue linked to a customer request is done, email the requester.</p><h3>Activity</h3><div class=\"line\"><div class=\"ev \"><b>Mira</b> linked 3 requests<br><span style=\"color:var(--faint)\">yesterday</span></div></div></div><div class=\"say\"><span>Comment\u2026</span><kbd class=\"mono\">\u2318\u23ce</kbd></div>", "ENG-146": "<div class=\"peek\"><span class=\"id mono\">ENG-146</span><h2>Lazy-load board columns</h2><div class=\"props\"><span class=\"prop\"><span>Status</span>Todo</span><span class=\"prop\"><span>Assignee</span>AL</span><span class=\"prop\"><span>Cycle</span>14</span></div><p>Boards with long columns are slow to open. Render what is on screen.</p><h3>Activity</h3><div class=\"line\"><div class=\"ev \"><b>Ada</b> created the issue<br><span style=\"color:var(--faint)\">today</span></div></div></div><div class=\"say\"><span>Comment\u2026</span><kbd class=\"mono\">\u2318\u23ce</kbd></div>", "ENG-139": "<div class=\"peek\"><span class=\"id mono\">ENG-139</span><h2>Signed webhooks</h2><div class=\"props\"><span class=\"prop\"><span>Status</span>Done</span><span class=\"prop\"><span>Assignee</span>GH</span><span class=\"prop\"><span>Cycle</span>14</span><span class=prop><span>Branch</span>merged</span></div><p>Sign every webhook delivery so receivers can check it came from Cruuze.</p><h3>Activity</h3><div class=\"line\"><div class=\"ev hot\"><b>Grace</b> merged the pull request<br><span style=\"color:var(--faint)\">moved to Done</span></div></div></div><div class=\"say\"><span>Comment\u2026</span><kbd class=\"mono\">\u2318\u23ce</kbd></div>"}
  const peek = document.getElementById('peek')
  const show = (id) => {
    peek.innerHTML = PEEKS[id]
    document.querySelectorAll('.item').forEach((el) => el.setAttribute('aria-selected', String(el.dataset.id === id)))
  }
  document.querySelectorAll('.item').forEach((el) => el.addEventListener('click', () => show(el.dataset.id)))
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => document.querySelectorAll('.seg button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)))))
  show('ENG-142')
</script>
