# Cruuze on one machine: the app, its database and a web server that gets
# and renews the TLS certificate. See docs/self-hosting.md.
#
#   cp .env.example .env    # then edit it
#   docker compose up -d --build

name: cruuze

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cruuze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cruuze
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cruuze"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # A released image if CRUUZE_IMAGE names one, else built from this checkout.
    image: ${CRUUZE_IMAGE:-cruuze}:${CRUUZE_VERSION:-latest}
    build:
      context: ..
      args:
        VERSION: ${CRUUZE_VERSION:-source}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cruuze:${POSTGRES_PASSWORD}@postgres:5432/cruuze?sslmode=disable
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      # Caddy is in front and passes the visitor's address along.
      TRUST_PROXY: "true"
      INSTANCE_ADMINS: ${INSTANCE_ADMINS:-}
      IMPORT_ALLOW_PRIVATE: ${IMPORT_ALLOW_PRIVATE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Cruuze <noreply@${DOMAIN}>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      # Attachments, unless S3_BUCKET is set.
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
