name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cruuze
          POSTGRES_PASSWORD: cruuze
          POSTGRES_DB: cruuze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cruuze"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://cruuze:cruuze@localhost:5432/cruuze_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Generated code is up to date
        working-directory: .
        run: |
          make generate-server
          git diff --exit-code -- server/internal/db/dbgen server/internal/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cruuze
          POSTGRES_PASSWORD: cruuze
          POSTGRES_DB: cruuze_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cruuze"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://cruuze:cruuze@localhost:5432/cruuze_e2e?sslmode=disable
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The production image builds
        run: docker build -t cruuze .
